name: Publish market data snapshot

on:
  push:
    branches: [main]
    paths: [.github/workflows/publish-market-data.yml]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-market-data-20261115
  cancel-in-progress: false

jobs:
  prepare:
    if: github.event_name == 'workflow_dispatch' || github.event.head_commit.message == 'Publish verified raw market data'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: market-data-2026-11-15
        run: |
          set -euo pipefail
          if gh release view "$TAG" --json isDraft --jq .isDraft 2>/dev/null | grep -qx true; then
            echo "Draft release already exists; resuming."
          elif gh release view "$TAG" >/dev/null 2>&1; then
            echo "The release is already published; refusing to replace it." >&2
            exit 1
          else
            gh release create "$TAG" --draft --target "$GITHUB_SHA" --title "Verified public market data snapshot" --notes-file data/RELEASE_NOTES.md
          fi

  publish-parts:
    needs: prepare
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        part: [1, 2, 3, 4, 5, 6, 7]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Download and verify archives
        env:
          PART: ${{ matrix.part }}
        run: |
          set -euo pipefail
          filename=$(printf 'market-data-part-%02d.tar' "$PART")
          python3 data/build_release_part.py "$PART" --output "$filename" --staging "$RUNNER_TEMP/market-data"
      - name: Upload verified part
        env:
          GH_TOKEN: ${{ github.token }}
          PART: ${{ matrix.part }}
          TAG: market-data-2026-11-15
        run: |
          set -euo pipefail
          filename=$(printf 'market-data-part-%02d.tar' "$PART")
          gh release upload "$TAG" "$filename"

  finalize:
    needs: publish-parts
    runs-on: ubuntu-latest
    steps:
      - name: Publish completed release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: market-data-2026-11-15
        run: gh release edit "$TAG" --draft=false
